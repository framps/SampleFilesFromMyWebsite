option domain-name "framp.home";
# a minimal /etc/dhcpd.conf example
# this statement is needed by dhcpd-3 needs at least this statement.
# you have to delete it for dhcpd-2, because it does not know it.
ddns-update-style none;
ddns-updates off;
# this subnet is served by us
authoritative ;
max-lease-time 28800; # 2 days
default-lease-time 14400;
#
# wpad
#
#option wpad code 252 = text;
# these addresses will be given out dynamically
subnet 192.168.0.0 netmask 255.255.255.0 {
#  option wpad "http://192.168.0.1/wpad.dat";
  option routers 192.168.0.1;
  option netbios-name-servers 192.168.0.6;
  option ntp-servers 192.168.0.1;
  option lpr-servers 192.168.0.6;
  option domain-name-servers 192.168.0.1;
  option domain-name "framp.home";
  option broadcast-address 192.168.0.255;
  range 192.168.0.100 192.168.0.200;
  default-lease-time 14400;
  max-lease-time 172800;
}
subnet 192.168.3.0 netmask 255.255.255.0 {
#  option wpad "http://192.168.3.1/wpad.dat";
  range 192.168.3.100 192.168.3.254;
  option routers 192.168.3.1;
  option domain-name-servers 192.168.3.1;
  option domain-name "framp.home";
  option broadcast-address 192.168.3.255;
  default-lease-time 3600;  # 1h
  max-lease-time 14400; # 1d
}
subnet 192.168.100.0 netmask 255.255.255.0 {
#  option wpad "http://192.168.100.1/wpad.dat";
  option routers 192.168.100.1;
  option domain-name-servers 192.168.100.1;
  option domain-name "framp.home";
  option broadcast-address 192.168.100.255;
  range 192.168.100.100 192.168.100.254;
  default-lease-time 14400;
  max-lease-time 604800;
}
subnet 192.168.10.0 netmask 255.255.255.0 {
}
subnet 192.168.105.0 netmask 255.255.255.0 {
}
subnet 192.168.150.0 netmask 255.255.255.0 {
}
# this host is known by its hardware address and we want a fixed address for it

host tp3 {
  hardware ethernet 00:13:02:0e:59:bb;	# wlan
  fixed-address 192.168.3.4;
}

host ap {
  hardware ethernet 00:09:5b:40:fe:0d; 	# Netgear AP
  fixed-address 192.168.3.7;
}

host tp {
  hardware ethernet 00:16:41:15:84:fa;	# eth
  fixed-address 192.168.0.4;
}

host xxxxxx {
  hardware ethernet 00:0e:a6:3b:dd:06;
  fixed-address 192.168.0.3;
}
host yyyyy {
  hardware ethernet 00:50:fc:a6:cf:d4;
  fixed-address 192.168.0.2;
}
host obelix {
  hardware ethernet 00:09:5b:61:cd:e0;
  fixed-address 192.168.0.6;
}
host idefix {
  hardware ethernet 00:50:fc:a6:f1:06;
  fixed-address 192.168.0.5;
}

