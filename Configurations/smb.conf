# smb.conf is the main Samba configuration file. You find a full commented
# version at /usr/share/doc/packages/samba/examples/smb.conf.SUSE if the
# samba-doc package is installed.
# Date: 2005-04-04
[global]
	workgroup = FRAMP
	netbios name = IDEFIX
	server string = 
	wins support = yes
	name resolve order = wins host lmhosts bcast
	os level = 80
	time server = yes
	passdb backend = smbpasswd
 	printing = cups
	printcap name = cups
	printcap cache time = 750
	cups options = raw
	printer admin = @ntadmin, root, administrator, @users
	username map = /etc/samba/smbusers
	map to guest = Bad User
#	include = /etc/samba/dhcp.conf
#	logon path = \\%L\profiles\.msprofile
#	logon home = \\%L\%U\.9xprofile
#	logon drive = P:
	local master = no
	encrypt passwords = yes
	security = user

	domain master = yes
	local master = yes
	prefered master = yes
	logfile = /var/log/samba/%m

#[profiles]
#	comment = Network Profiles Service
#	path = %H
#	read only = No
#	store dos attributes = Yes
#	create mask = 0600
#	directory mask = 0700

[vol2]
	comment = Disk volume 2
	path = /disks/vol2
	read only = No
	public = no
	valid users = pt

[vol_mt]
	comment = 40GB disk
	path = /disks/vol3
	writable = yes
	public = no
	valid users = mt
	browsable = no
	guest ok = no

[users]
	comment = All users
	path = /home
	read only = No
	inherit acls = Yes
	veto files = /aquota.user/groups/shares/

#[groups]
#	comment = All groups
#	path = /home/groups
#	read only = No
#	inherit acls = Yes
[printers]
	comment = All Printers
	path = /var/tmp
	printable = Yes
	create mask = 0600
	browseable = yes
[print$]
	comment = Printer Drivers
	path = /var/lib/samba/drivers
	write list = @ntadmin root
	force group = ntadmin
	create mask = 0664
	directory mask = 0775

[scratch]
	comment = Scratch Disk
	path = /disks/vol2/scratch
	writable = yes
	browsable = yes

[photos]
	comment = Digitalphotos
	path = /disks/vol2/photos
	writable = no
	browsable = yes

[music]
	comment = Musik
	path = /disks/vol2/mp3
	writable = no
	browsable = yes

[software]
	comment = Software
	path = /disks/vol2/software
	writable = no
	browsable = yes

[videos]
	comment = Videos
	path = /disks/vol2/videos
	writable = no
	browsable = yes

